<!-- assets/logo/app_logo.svg -->
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">

  <!-- Arco principal: de 3 a 12 pasando por 6 y 9 (color de acento) -->
  <path
    d="M 472 256 A 216 216 0 0 1 256 472 A 216 216 0 0 1 40 256 A 216 216 0 0 1 256 40"
    fill="none"
    stroke="#5577bb"
    stroke-width="24"
    stroke-linecap="round"/>

  <!-- Arco blanco: de 12 a 3 (cuadrante superior derecho) -->
  <path
    d="M 256 40 A 216 216 0 0 1 472 256"
    fill="none"
    stroke="#fbfbfb"
    stroke-width="24"
    stroke-linecap="round"/>

  <!-- 4 barras verticales redondeadas centradas, alturas variables -->
  <line x1="196" y1="216" x2="196" y2="296" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <line x1="236" y1="180" x2="236" y2="332" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <line x1="276" y1="236" x2="276" y2="276" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>
  <line x1="316" y1="200" x2="316" y2="312" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round"/>

</svg>
