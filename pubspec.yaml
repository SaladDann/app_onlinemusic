name: offline_music
description: Reproductor de musica local y en la nube con modo Fusion.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  http: ^1.2.2
  sqflite: ^2.4.2
  path: ^1.9.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/app_icon_1024.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/logo/app_icon_1024.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
